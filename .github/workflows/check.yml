# Formatting and unit tests, the same as .githooks/pre-commit.
name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.1, cache-key: check }
      - run: sudo apt-get update && sudo apt-get install -y glslc
      - run: zig fmt --check build.zig build.zig.zon src packaging
      # Ubuntu 24.04 has no SDL3 package.
      - run: zig build test -Dsystem-sdl=false --error-style minimal
