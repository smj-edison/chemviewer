# Builds the Windows and macOS packages. Run by hand (Actions > Package), or
# push a tag like v0.1.0 to also put them on a draft GitHub release.
name: Package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is cross-compiled; macOS needs Apple's SDK.
          - name: linux
            system: linux
            os: ubuntu-24.04
            setup: sudo apt-get update && sudo apt-get install -y glslc
          - name: windows
            system: windows
            os: ubuntu-24.04
            setup: sudo apt-get update && sudo apt-get install -y glslc nsis
          - name: macos-arm64
            system: macos
            os: macos-15
            setup: brew install shaderc
          - name: macos-intel
            system: macos
            os: macos-15-intel
            setup: brew install shaderc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.1, cache-key: "${{ matrix.name }}" }
      - run: ${{ matrix.setup }}
      - run: packaging/build-packages.sh ${{ matrix.system }} "${VERSION#v}"
      # Not archived: each artifact is the package itself, named after its file.
      - uses: actions/upload-artifact@v7
        with: { path: dist/chemviewer-*-local*, archive: false, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { path: dist/chemviewer-*-installer*, archive: false, if-no-files-found: error }
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Keep the macOS .zip as it is.
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true, skip-decompress: true }
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes dist/* LICENSE packaging/THIRD-PARTY-NOTICES.txt
        env:
          GH_TOKEN: ${{ github.token }}
