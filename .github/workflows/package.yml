# Builds the Windows and macOS packages. Run by hand (Actions > Package), or
# push a tag like v0.1.0 to also put them on a draft GitHub release.
name: Package
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is cross-compiled; macOS needs Apple's SDK.
          - name: windows
            system: windows
            os: ubuntu-24.04
            setup: sudo apt-get update && sudo apt-get install -y glslc nsis
          - name: macos-arm64
            system: macos
            os: macos-15
            setup: brew install shaderc
          - name: macos-intel
            system: macos
            os: macos-15-intel
            setup: brew install shaderc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.1 }
      - run: ${{ matrix.setup }}
      - run: packaging/build-packages.sh ${{ matrix.system }} "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/chemviewer-*
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
